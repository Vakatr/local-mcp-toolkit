[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "local-mcp-toolkit"
version = "0.1.0"
description = "Local-first MCP servers for files, Python scripts and LLM delegation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vakatr" }]
keywords = ["mcp", "model-context-protocol", "ai", "llm", "local-first", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
mcp-filesystem = "local_mcp_toolkit.filesystem:main"
mcp-python-runner = "local_mcp_toolkit.python_runner:main"
mcp-delegate = "local_mcp_toolkit.delegate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_mcp_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["local_mcp_toolkit"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
